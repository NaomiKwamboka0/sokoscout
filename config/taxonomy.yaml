# Kenyan retail vocabulary, as explicit rules rather than a model.
#
# The same product is described as a power bank, a powerbank, a phone charger
# and a portable charger. Classifying that correctly is the difference between
# a median price over 1,200 real observations and a median over three
# unrelated things.
#
# Deliberately rules and not a model, for two reasons that both matter more
# than accuracy on an average case:
#
#   1. A wrong classification is fixed by editing one line here, by somebody
#      who is not an engineer, and the fix is live on the next run.
#   2. The same input always produces the same output. Reproducibility is what
#      a vendor is actually paying for. A number that changes because a model
#      was retrained is not a number they can commit stock against.
#
# `commission_rate` is the platform's own published rate, with the source and
# the date it was read. It feeds the margin calculator, so a stale rate is a
# wrong answer about somebody's money. Re-read the schedule quarterly.

