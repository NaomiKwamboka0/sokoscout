# ---------------------------------------------------------------------------
# Accessory guard.
#
# A real failure from the first live run, and the reason this section exists:
#
#   "Universal Charging Plug For Kids Toy Cars"
#
# is a charger. It matched the toys keyword "kids toy" because that phrase
# appears inside "Kids Toy Cars", and a 2,499 shilling charger landed in the
# toys median. The adversarial review of the taxonomy predicted exactly this
# and it happened anyway, because keyword matching alone cannot tell an item
# apart from an accessory FOR that item.
#
# The rule: when a title contains one of these accessory words, the listing is
# an accessory to the thing it names, not the thing itself. It is reassigned
# to the category that owns the accessory word, or left unclassified if no
# category claims it.
#
# Written as data rather than code so the same person who edits keywords can
# fix a misclassification here too.
# Each marker names the accessory UNAMBIGUOUSLY, without assuming what it is
# an accessory for. "charger" is a charger whatever it charges. "case for" is
# NOT here, because a case can be for a phone, a guitar, a camera or a laptop,
# and assuming phone put guitar cases and sofa covers into the phone
# accessories median in review.
#
# The rule for adding one: if you can finish the sentence "a <marker> is
# always a ___" with a single category, it belongs here. If the answer depends
# on what follows the word, it does not.
accessory_markers:
  charger: power_banks
  charging plug: power_banks
  charging cable: power_banks
  charging cord: power_banks
  power adapter: power_banks
  power bank: power_banks
  replacement battery: power_banks
  spare battery: power_banks
  phone case: phone_accessories
  phone cover: phone_accessories
  screen protector: phone_accessories

# Markers that only apply when the title also names the thing they belong to.
# "case" alone is ambiguous; "case for samsung" is not.
#
# Written as marker -> {owner, requires} so the ambiguity is resolved by
# evidence in the title rather than by an assumption in the code.
qualified_accessory_markers:
  - marker: "case for"
    owner: phone_accessories
    requires: [phone, samsung, iphone, tecno, infinix, oppo, redmi, xiaomi,
               huawei, nokia, itel, vivo, realme, pixel, galaxy]
  - marker: "cover for"
    owner: phone_accessories
    requires: [phone, samsung, iphone, tecno, infinix, oppo, redmi, xiaomi,
               huawei, nokia, itel, vivo, realme, pixel, galaxy]
  - marker: "remote control for"
    owner: tv_accessories
    requires: [tv, television, decoder, decorder, dstv, gotv, startimes]

# Categories the accessory guard must never override. These legitimately sell
# the accessory itself as their main product, so redirecting them would be the
# mirror image of the bug.
accessory_guard_exempt:
  - power_banks
  - phone_accessories
  - tv_accessories
  - computing

# ---------------------------------------------------------------------------
# Condition overrides.
#
# Some categories describe the CONDITION of a thing rather than what the thing
# is, and condition beats product type for pricing. A bale of second hand
# dresses is priced as thrift, not as dresses; the two medians are not close.
#
# Hit counting alone gets this backwards, because a thrift listing names its
# garments repeatedly and its condition once:
#
#   "Camera Bale Dresses Skirts Blouse"
#      fashion_womens: 3 hits    thrift: 1 hit    ->  fashion_womens
#
# That put a wholesale thrift bale into the retail womenswear median. So a
# category listed here wins whenever it matches at all, regardless of how
# many keywords another category matched.
condition_overrides:
  - thrift

# ---------------------------------------------------------------------------
# Price vocabulary. Kenyan listings write prices in forms a plain number parser
# silently gets wrong, and a silently wrong price is worse than no price.
# ---------------------------------------------------------------------------
price_forms:
  currency_prefixes: ["KSh", "Ksh", "KES", "Kshs", "ksh", "kes", "/=", "/-"]
  # "1.5k" means 1,500. A naive float parse yields 1.5, which is not a price
  # anybody in this market has ever charged for anything.
  thousand_suffixes: ["k", "K"]
  # Ranges are common on category pages: "KSh 500 - KSh 1,200".
  range_separators: [" - ", " to ", " – "]

# Words that mean this listing is not a physical good we can price. A service
# priced per hour has no place in a product median.
service_markers:
  - salon
  - saloon
  - barber
  - spa
  - massage
  - consultation
  - booking
  - repair service
  - installation
  - training
  - course
  - tuition
