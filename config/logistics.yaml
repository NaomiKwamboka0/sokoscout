# Last mile delivery cost by county, per platform.
#
# This file is the second half of the margin calculation. Without it the
# product refuses to state a margin, which is correct but not useful, so this
# exists to make the answer available rather than to make it up.
#
# Every figure carries the date it was read and where it came from. A stale
# delivery cost is a wrong answer about somebody's money, so `read` is not
# decoration: the product surfaces it next to the margin, and anything older
# than a quarter should be re-checked before it is trusted.
#
# Where a figure is unknown it is written as `null` rather than estimated. The
# margin calculation then refuses for that county specifically, which is a
# better outcome than a national average quietly standing in for Turkana.

meta:
  source: "Jumia Kenya published delivery fee schedule and pickup station list"
  read: 2026-09-09
  currency: KES
  note: >-
    Door delivery to the county's main urban area. Pickup station collection
    is cheaper where a station exists, and is listed separately because it
    materially changes the arithmetic for a low value product.

jumia_ke:
  # Tier 1: Nairobi and the major cities. Same or next day, dense station
  # coverage, and the cheapest last mile in the country.
  nairobi:
    door_delivery: 145
    pickup_station: 99
    stations: 40
    typical_days: 1
  mombasa:
    door_delivery: 210
    pickup_station: 130
    stations: 9
    typical_days: 2
  kiambu:
    door_delivery: 180
    pickup_station: 110
    stations: 7
    typical_days: 2
  kisumu:
    door_delivery: 260
    pickup_station: 150
    stations: 4
    typical_days: 3
  nakuru:
    door_delivery: 250
    pickup_station: 145
    stations: 5
    typical_days: 3

