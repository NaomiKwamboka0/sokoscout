# Kenyan counties with confirmed platform logistics.
#
# This file is the reason a vendor cannot be shown an encouraging answer about
# a county where the platform cannot actually collect or deliver. The county
# list in the product is read from here, not typed as free text, so an answer
# about Wajir is impossible rather than merely unlikely.
#
# `has_logistics: false` counties are deliberately present. The product says
# "we do not have delivery coverage there" rather than silently omitting the
# county, because a vendor who cannot find their county assumes we are broken.

counties:
  - code: nairobi
    name: Nairobi
    tier: 1
    has_logistics: true
    wards:
      - {code: cbd,        name: CBD,           note: "plaza retail, phone and electronics"}
      - {code: gikomba,    name: Gikomba,       note: "thrift and fashion wholesale"}
      - {code: eastleigh,  name: Eastleigh,     note: "textiles, electronics, wholesale"}
      - {code: westlands,  name: Westlands,     note: "higher income retail"}
      - {code: karen,      name: Karen,         note: "higher income retail"}
      - {code: embakasi,   name: Embakasi,      note: "residential volume"}
      - {code: kasarani,   name: Kasarani,      note: "residential volume"}
      - {code: dagoretti,  name: Dagoretti,     note: "residential"}

  - code: mombasa
    name: Mombasa
    tier: 1
    has_logistics: true
    wards:
      - {code: nyali,      name: Nyali,         note: "higher income coastal retail"}
      - {code: kongowea,   name: Kongowea,      note: "market trade"}
      - {code: mvita,      name: Mvita,         note: "island CBD"}

  - code: kiambu
